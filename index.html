<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SignAI</title>

<style>
body {
    margin: 0;
    font-family: sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: #f5f7fb;
}

.card {
    background: white;
    padding: 30px;
    border-radius: 15px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
}

input {
    padding: 10px;
    width: 70%;
    border-radius: 10px;
    border: 1px solid #ccc;
}

button {
    padding: 10px 15px;
    border: none;
    background: orange;
    color: white;
    border-radius: 10px;
    cursor: pointer;
    margin-top: 10px;
}

video {
    margin-top: 20px;
    width: 100%;
    display: none;
}
</style>
</head>

<body>

<div class="card">
    <h2>Text → Sign Language</h2>

    <input id="inputText" placeholder="Type a word..." />
    <br><br>

    <button onclick="sendData()">Translate</button>

    <video id="videoPlayer" controls></video>
</div>

<script>

const BASE_URL = "https://entrust-arrange-duffel.ngrok-free.dev";

// TEXT → VIDEO
async function sendData() {
    const input = document.getElementById("inputText").value;
    const video = document.getElementById("videoPlayer");

    try {
        const response = await fetch(BASE_URL + "/translate", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "ngrok-skip-browser-warning": "true"
            },
            body: JSON.stringify({ text: input })
        });

        const data = await response.json();
        console.log("Response:", data);

        if (data.status === "found") {
            video.src = BASE_URL + data.video_url;
            video.style.display = "block";
            video.play();
        } else {
            alert("No video found");
        }

    } catch (error) {
        console.error(error);
        alert("Backend error");
    }
}

</script>

</body>
</html>
