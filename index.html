<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SignAI</title>

<style>
html { scroll-behavior: smooth; }

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    padding-top: 70px;

    background:
        radial-gradient(circle at 20% 30%, rgba(255,180,120,0.8), transparent 40%),
        radial-gradient(circle at 80% 20%, rgba(120,140,255,0.8), transparent 40%),
        radial-gradient(circle at 70% 80%, rgba(255,120,200,0.7), transparent 40%),
        linear-gradient(135deg, #f5f7fb, #eaeefe);
}

/* NAVBAR */
.navbar {
    position: fixed;
    top: 0;
    width: 100%;
    display: flex;
    justify-content: space-between;
    padding: 15px 25px;
    backdrop-filter: blur(15px);
    background: rgba(255,255,255,0.3);
    z-index: 1000;
}

.logo { font-weight: 600; }

.nav-links {
    display: flex;
    gap: 20px;
}

.nav-links a {
    text-decoration: none;
    color: #333;
}

/* SECTIONS */
section {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* CARD */
.card {
    width: 100%;
    max-width: 520px;
    background: rgba(255,255,255,0.2);
    backdrop-filter: blur(20px);
    border-radius: 25px;
    padding: 30px;
    text-align: center;
}

/* INPUT */
input {
    padding: 12px;
    width: 65%;
    border-radius: 12px;
    border: none;
}

/* BUTTON */
button {
    padding: 12px 18px;
    border-radius: 12px;
    border: none;
    background: linear-gradient(135deg, #ff9966, #ff5e62);
    color: white;
    cursor: pointer;
}

/* VIDEO */
video {
    margin-top: 20px;
    width: 100%;
    border-radius: 15px;
    display: none;
}

.camera-box {
    margin-top: 20px;
}
</style>
</head>

<body>

<div class="navbar">
    <div class="logo">🖐 SignAI</div>
    <div class="nav-links">
        <a href="#home">Home</a>
        <a href="#signai">SignAI</a>
        <a href="#camera">Camera</a>
    </div>
</div>

<section id="home">
    <h1>Sign Language Interface</h1>
</section>

<section id="signai">
    <div class="card">
        <h2>Text → Sign Language</h2>

        <input id="inputText" placeholder="Type a word..." />
        <br><br>

        <button onclick="sendData()">Translate</button>

        <video id="videoPlayer" controls></video>
    </div>
</section>

<section id="camera">
    <div class="card">
        <h2>Camera Detection</h2>

        <div class="camera-box">
            <button onclick="startCamera()">Start Camera</button>
            <p id="cameraResult">Result will appear here</p>
        </div>
    </div>
</section>

<script>

const BASE_URL = "https://entrust-arrange-duffel.ngrok-free.dev";

// TEXT → VIDEO
async function sendData() {
    const input = document.getElementById("inputText").value;
    const video = document.getElementById("videoPlayer");

    try {
        const response = await fetch(BASE_URL + "/translate", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text: input })
        });

        const data = await response.json();

        if (data.status === "found") {
            video.src = BASE_URL + data.video_url;
            video.style.display = "block";
            video.play();
        } else {
            alert("No video found");
        }

    } catch (error) {
        console.error(error);
        alert("Backend error");
    }
}

// CAMERA (adjust endpoint if needed)
async function startCamera() {
    const result = document.getElementById("cameraResult");

    result.innerText = "Connecting...";

    try {
        const res = await fetch(BASE_URL + "/camera");
        const data = await res.json();

        result.innerText = "Result: " + data.text;

    } catch (err) {
        result.innerText = "Error connecting to backend";
    }
}

</script>

</body>
</html>
